<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Star Battle</title>

<style>
*{
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  margin:0;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

h1{margin-bottom:10px;}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

button{
  border:none;
  padding:10px 12px;
  border-radius:10px;
  background:#334155;
  color:white;
  cursor:pointer;
}

button.active{
  background:#2563eb;
}

#board{
  display:grid;
  border:4px solid white;
  border-radius:12px;
  overflow:hidden;
}

.cell{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  user-select:none;
}

.star{color:#facc15;}
.x{color:#cbd5e1;}

#msg{
  margin-top:10px;
  min-height:20px;
}

/* 太いエリア線 */
.top-border{border-top:4px solid white;}
.left-border{border-left:4px solid white;}
.right-border{border-right:4px solid white;}
.bottom-border{border-bottom:4px solid white;}

@media(max-width:600px){
  .cell{width:40px;height:40px;font-size:22px;}
}
</style>
</head>

<body>

<h1>⭐ Star Battle</h1>

<div class="controls">
  <button id="starBtn" onclick="setMode('star')">⭐ 星</button>
  <button id="xBtn" onclick="setMode('x')">❌ バツ</button>
  <button onclick="newGame()">🔄 新しい問題</button>
  <button onclick="showAnswer()">💡 答え表示</button>
</div>

<div id="board"></div>
<div id="msg"></div>

<script>

const SIZE = 8;

let mode = "star";
let boardData = [];
let regions = [];
let solution = [];

const board = document.getElementById("board");
const msg = document.getElementById("msg");

const COLORS = [
 "#1e293b","#3f1d2e","#14532d","#312e81",
 "#422006","#0f766e","#374151","#4c0519"
];

/* ===== モード ===== */
function setMode(m){
  mode = m;
  starBtn.classList.remove("active");
  xBtn.classList.remove("active");
  if(m==="star") starBtn.classList.add("active");
  if(m==="x") xBtn.classList.add("active");
}

/* ===== エリア生成（必ず2マス以上） ===== */
function makeRegions(){

  const grid = Array.from(
    {length:SIZE},
    ()=>Array(SIZE).fill(-1)
  );

  let id = 0;

  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(grid[r][c] !== -1) continue;

      const stack = [[r,c]];
      grid[r][c] = id;

      let size = 1;

      while(stack.length && size < 6){

        const [y,x] = stack.pop();

        for(const [dy,dx] of dirs){

          const ny = y + dy;
          const nx = x + dx;

          if(
            ny>=0 && nx>=0 &&
            ny<SIZE && nx<SIZE &&
            grid[ny][nx] === -1
          ){

            if(Math.random() < 0.6){

              grid[ny][nx] = id;
              stack.push([ny,nx]);
              size++;
            }
          }
        }
      }

      id++;
    }
  }

  // 最低2マス保証（小さいエリア修正）
  for(let i=0;i<3;i++){

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){

        const id = grid[r][c];

        let count = 0;

        for(let y=0;y<SIZE;y++){
          for(let x=0;x<SIZE;x++){
            if(grid[y][x] === id) count++;
          }
        }

        if(count < 2){

          const neighbors = [
            [1,0],[-1,0],[0,1],[0,-1]
          ];

          for(const [dy,dx] of neighbors){

            const ny=r+dy,nx=c+dx;

            if(
              ny>=0&&nx>=0&&
              ny<SIZE&&nx<SIZE
            ){
              grid[ny][nx] = id;
            }
          }
        }
      }
    }
  }

  return grid;
}

/* ===== ルール ===== */
function ok(stars,r,c){

  for(const [y,x] of stars){

    if(y===r||x===c) return false;

    if(
      Math.abs(y-r)<=1 &&
      Math.abs(x-c)<=1
    ) return false;

    if(regions[y][x] === regions[r][c])
      return false;
  }

  return true;
}

/* ===== 解（簡易・重すぎ防止） ===== */
function solve(){

  const stars=[];

  function dfs(r){

    if(r===SIZE) return true;

    for(let c=0;c<SIZE;c++){

      if(ok(stars,r,c)){

        stars.push([r,c]);

        if(dfs(r+1)) return true;

        stars.pop();
      }
    }

    return false;
  }

  dfs(0);
  return stars;
}

/* ===== 唯一解チェック（簡易） ===== */
function hasAnotherSolution(){

  let count = 0;

  const stars=[];

  function dfs(r){

    if(r===SIZE){

      count++;
      return count > 1;
    }

    for(let c=0;c<SIZE;c++){

      if(ok(stars,r,c)){

        stars.push([r,c]);

        if(dfs(r+1)) return true;

        stars.pop();
      }
    }

    return false;
  }

  dfs(0);

  return count > 1;
}

/* ===== 新規問題 ===== */
function newGame(){

  let tries = 0;

  do{

    regions = makeRegions();
    solution = solve();

    tries++;

    if(tries > 10) break;

  }while(hasAnotherSolution());

  boardData = Array.from(
    {length:SIZE},
    ()=>Array(SIZE).fill({s:false,x:false})
  );

  boardData = boardData.map(r =>
    r.map(()=>({s:false,x:false}))
  );

  draw();
}

/* ===== 描画 ===== */
function draw(){

  board.innerHTML="";
  board.style.gridTemplateColumns =
    `repeat(${SIZE},1fr)`;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      const cell=document.createElement("div");
      cell.className="cell";

      const id = regions[r][c];

      cell.style.background =
        COLORS[id % COLORS.length];

      // 太線エリア
      if(r===0 || regions[r][c]!==regions[r-1]?.[c])
        cell.classList.add("top-border");

      if(c===0 || regions[r][c]!==regions[r][c-1])
        cell.classList.add("left-border");

      if(r===SIZE-1 || regions[r][c]!==regions[r+1]?.[c])
        cell.classList.add("bottom-border");

      if(c===SIZE-1 || regions[r][c]!==regions[r][c+1])
        cell.classList.add("right-border");

      if(boardData[r][c].s)
        cell.innerHTML="⭐";

      if(boardData[r][c].x)
        cell.innerHTML="❌";

      cell.onclick=()=>{

        if(mode==="star"){

          boardData[r][c].s =
            !boardData[r][c].s;

          if(boardData[r][c].s)
            boardData[r][c].x=false;
        }

        if(mode==="x"){

          boardData[r][c].x =
            !boardData[r][c].x;

          if(boardData[r][c].x)
            boardData[r][c].s=false;
        }

        draw();
        check();
      };

      board.appendChild(cell);
    }
  }
}

/* ===== チェック ===== */
function check(){

  let stars=[];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(boardData[r][c].s)
        stars.push([r,c]);
    }
  }

  let okFlag=true;

  for(const [r,c] of stars){

    if(!ok(stars,r,c)){
      okFlag=false;
    }
  }

  if(okFlag && stars.length===SIZE){
    msg.textContent="🎉 クリア！";
  }else{
    msg.textContent="";
  }
}

/* ===== 答え ===== */
function showAnswer(){

  boardData =
    boardData.map((row,r)=>
      row.map((cell,c)=>({
        s: solution.some(
          ([y,x])=>y===r&&x===c
        ),
        x:false
      }))
    );

  draw();
}

newGame();

</script>

</body>
</html>
