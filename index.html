<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Star Battle</title>

<style>
*{
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  margin:0;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

h1{
  margin-bottom:10px;
}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  background:#334155;
  color:white;
  cursor:pointer;
}

button.active{
  background:#2563eb;
}

#board{
  display:grid;
  border:4px solid white;
  border-radius:12px;
  overflow:hidden;
}

.cell{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  user-select:none;
  border:1px solid rgba(255,255,255,0.08);
}

.star{color:#facc15;}
.x{color:#cbd5e1;}

#message{
  margin-top:10px;
  min-height:20px;
  font-weight:bold;
}

@media(max-width:600px){
  .cell{
    width:40px;
    height:40px;
    font-size:22px;
  }
}
</style>
</head>

<body>

<h1>⭐ Star Battle</h1>

<div class="controls">
  <button id="starBtn" onclick="setMode('star')">⭐ 星</button>
  <button id="xBtn" onclick="setMode('x')">❌ バツ</button>
</div>

<div id="board"></div>
<div id="message"></div>

<script>

const SIZE = 8;
const REGION_COUNT = 8;

let mode = "star";
let player = [];
let regions = [];
let solution = [];

const board = document.getElementById("board");
const message = document.getElementById("message");

/* ===== モード ===== */

function setMode(m){
  mode = m;

  starBtn.classList.remove("active");
  xBtn.classList.remove("active");

  if(m === "star") starBtn.classList.add("active");
  if(m === "x") xBtn.classList.add("active");
}

/* ===== エリア生成（安定ランダム） ===== */

function createRegions(){

  const grid =
    Array.from({length:SIZE},
      ()=>Array(SIZE).fill(-1));

  let id = 0;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(grid[r][c] !== -1) continue;

      const stack = [[r,c]];
      grid[r][c] = id;

      while(stack.length){

        const [y,x] = stack.pop();

        const dirs = [
          [1,0],[-1,0],[0,1],[0,-1]
        ];

        for(const [dy,dx] of dirs){

          const ny = y + dy;
          const nx = x + dx;

          if(
            ny>=0 && nx>=0 &&
            ny<SIZE && nx<SIZE &&
            grid[ny][nx] === -1
          ){

            if(Math.random() < 0.6){

              grid[ny][nx] = id;
              stack.push([ny,nx]);
            }
          }
        }
      }

      id++;
      if(id >= REGION_COUNT) return grid;
    }
  }

  return grid;
}

/* ===== ルール判定 ===== */

function valid(stars,r,c){

  for(const [y,x] of stars){

    if(y === r || x === c) return false;

    if(
      Math.abs(y-r)<=1 &&
      Math.abs(x-c)<=1
    ) return false;

    if(regions[y][x] === regions[r][c])
      return false;
  }

  return true;
}

/* ===== 解答生成 ===== */

function solve(){

  const stars = [];

  function dfs(r){

    if(r === SIZE) return true;

    for(let c=0;c<SIZE;c++){

      if(valid(stars,r,c)){

        stars.push([r,c]);

        if(dfs(r+1)) return true;

        stars.pop();
      }
    }

    return false;
  }

  dfs(0);

  return stars;
}

/* ===== 初期化 ===== */

function setup(){

  regions = createRegions();
  solution = solve();

  player = Array.from({length:SIZE},
    ()=>Array.from({length:SIZE},
      ()=>({star:false,x:false})
    )
  );

  draw();
}

/* ===== 描画 ===== */

function draw(){

  board.innerHTML = "";
  board.style.gridTemplateColumns =
    `repeat(${SIZE},1fr)`;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      const cell = document.createElement("div");
      cell.className = "cell";

      if(player[r][c].star)
        cell.innerHTML = "⭐";

      if(player[r][c].x)
        cell.innerHTML = "❌";

      cell.onclick = ()=>{

        if(mode === "star"){

          player[r][c].star =
            !player[r][c].star;

          if(player[r][c].star)
            player[r][c].x = false;
        }

        if(mode === "x"){

          player[r][c].x =
            !player[r][c].x;

          if(player[r][c].x)
            player[r][c].star = false;
        }

        draw();
        check();
      };

      board.appendChild(cell);
    }
  }
}

/* ===== 軽量チェック（固まらない版） ===== */

function check(){

  let stars = [];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(player[r][c].star){
        stars.push([r,c]);
      }
    }
  }

  let ok = true;

  for(let i=0;i<stars.length;i++){

    const [r1,c1] = stars[i];

    for(let j=i+1;j<stars.length;j++){

      const [r2,c2] = stars[j];

      if(
        r1 === r2 ||
        c1 === c2 ||
        regions[r1][c1] === regions[r2][c2] ||
        (
          Math.abs(r1-r2)<=1 &&
          Math.abs(c1-c2)<=1
        )
      ){
        ok = false;
      }
    }
  }

  if(ok && stars.length === SIZE){
    message.textContent = "🎉 クリア！";
  }else{
    message.textContent = "";
  }
}

/* ===== 起動 ===== */

setup();

</script>

</body>
</html>
