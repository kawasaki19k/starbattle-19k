<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Star Battle</title>

<style>

*{
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  margin:0;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

h1{
  margin-bottom:10px;
}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  border:none;
  background:#334155;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

button.active{
  background:#2563eb;
}

#board{
  display:grid;
  border:4px solid white;
  border-radius:12px;
  overflow:hidden;
}

.cell{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  user-select:none;
  border:1px solid rgba(255,255,255,0.08);
}

.star{
  color:#facc15;
  text-shadow:0 0 10px rgba(250,204,21,0.8);
}

.xmark{
  color:#cbd5e1;
  font-size:22px;
}

.invalid{
  background:#7f1d1d !important;
}

#message{
  margin-top:12px;
  min-height:24px;
  font-weight:bold;
}

.rule{
  margin-top:20px;
  opacity:0.8;
  text-align:center;
  line-height:1.7;
}

/* スマホ */
@media(max-width:600px){
  .cell{
    width:40px;
    height:40px;
    font-size:22px;
  }
}

</style>
</head>

<body>

<h1>⭐ Star Battle</h1>

<div class="controls">
  <button id="starBtn" onclick="setMode('star')">⭐ 星</button>
  <button id="xBtn" onclick="setMode('x')">❌ バツ</button>
  <button id="eraseBtn" onclick="setMode('erase')">🧽 消す</button>
</div>

<div class="controls">
  <button onclick="newGame()">新しい問題</button>
  <button onclick="showAnswer()">答え表示</button>
</div>

<div id="board"></div>

<div id="message"></div>

<div class="rule">
各行・列・エリアに星は1つだけ<br>
星同士は縦横斜めに隣接不可
</div>

<script>

const SIZE = 8;
const REGION_COUNT = 8;

let player = [];
let regions = [];
let solution = [];

let mode = "star";

const board =
  document.getElementById("board");

const message =
  document.getElementById("message");

function setMode(m){

  mode = m;

  document.querySelectorAll("button")
    .forEach(b=>b.classList.remove("active"));

  if(m==="star")
    starBtn.classList.add("active");

  if(m==="x")
    xBtn.classList.add("active");

  if(m==="erase")
    eraseBtn.classList.add("active");
}

/* --- ランダム --- */

function rand(seed){

  return function(){

    seed =
      (seed * 9301 + 49297)
      % 233280;

    return seed / 233280;
  }
}

/* --- エリア生成（ランダム風） --- */

function createRegions(seed){

  const r = rand(seed);

  const grid =
    Array.from({length:SIZE},
      ()=>Array(SIZE).fill(-1));

  let id = 0;

  const seeds = [];

  while(seeds.length < REGION_COUNT){

    const y = Math.floor(r()*SIZE);
    const x = Math.floor(r()*SIZE);

    if(!seeds.some(p=>p[0]===y&&p[1]===x)){
      seeds.push([y,x]);
    }
  }

  for(let i=0;i<REGION_COUNT;i++){

    const [y,x] = seeds[i];

    grid[y][x] = i;
  }

  const dirs = [
    [1,0],[-1,0],[0,1],[0,-1]
  ];

  let changed = true;

  while(changed){

    changed = false;

    for(let y=0;y<SIZE;y++){
      for(let x=0;x<SIZE;x++){

        if(grid[y][x]===-1){

          const candidates = [];

          for(const [dy,dx] of dirs){

            const ny=y+dy,nx=x+dx;

            if(
              ny>=0&&nx>=0&&
              ny<SIZE&&nx<SIZE&&
              grid[ny][nx]!==-1
            ){
              candidates.push(grid[ny][nx]);
            }
          }

          if(candidates.length){

            grid[y][x] =
              candidates[
                Math.floor(
                  Math.random()*
                  candidates.length
                )
              ];

            changed = true;
          }
        }
      }
    }
  }

  return grid;
}

/* --- ルール --- */

function valid(stars,r,c){

  for(const [y,x] of stars){

    if(y===r||x===c) return false;

    if(
      Math.abs(y-r)<=1 &&
      Math.abs(x-c)<=1
    ) return false;

    if(regions[y][x]===regions[r][c])
      return false;
  }

  return true;
}

/* --- 解答生成（簡易） --- */

function solve(){

  const stars=[];

  function dfs(r){

    if(r===SIZE) return true;

    for(let c=0;c<SIZE;c++){

      if(valid(stars,r,c)){

        stars.push([r,c]);

        if(dfs(r+1)) return true;

        stars.pop();
      }
    }

    return false;
  }

  dfs(0);

  return stars;
}

/* --- 初期化 --- */

function setup(seed){

  regions = createRegions(seed);

  solution = solve();

  player = Array.from({length:SIZE},
    ()=>Array.from({length:SIZE},
      ()=>({star:false,x:false})
    )
  );

  draw();
}

/* --- 描画 --- */

function draw(){

  board.innerHTML="";

  board.style.gridTemplateColumns =
    `repeat(${SIZE},1fr)`;

  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){

      const cell =
        document.createElement("div");

      cell.className="cell";

      const id = regions[y][x];

      cell.style.background =
        ["#172554","#3f1d2e","#14532d",
         "#3f3f46","#312e81","#422006",
         "#0f766e","#4c0519"][id];

      if(player[y][x].star)
        cell.innerHTML="⭐";

      if(player[y][x].x)
        cell.innerHTML="✕";

      cell.onclick=()=>{

        if(mode==="star"){

          player[y][x].star =
            !player[y][x].star;

          if(player[y][x].star)
            player[y][x].x=false;
        }

        if(mode==="x"){

          player[y][x].x =
            !player[y][x].x;

          if(player[y][x].x)
            player[y][x].star=false;
        }

        if(mode==="erase"){

          player[y][x].star=false;
          player[y][x].x=false;
        }

        draw();
        check();
      };

      board.appendChild(cell);
    }
  }
}

/* --- チェック --- */

function check(){

  let ok=true;
  let count=0;

  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){

      if(player[y][x].star){

        count++;

        if(!valid(
          Object.entries(player)
            .flatMap(([r,row])=>
              row.map((c,i)=>
                c.star?[+r,i]:null
              )
            ).filter(Boolean),
          y,x
        )){
          ok=false;
        }
      }
    }
  }

  if(ok && count===SIZE)
    message.textContent="🎉 クリア！";
  else
    message.textContent="";
}

/* --- 起動 --- */

setup(Date.now());

</script>

</body>
</html>
