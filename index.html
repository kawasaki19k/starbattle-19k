<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Star Battle</title>

<style>

*{
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  margin:0;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

h1{
  margin-bottom:10px;
}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  border:none;
  background:#334155;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  background:#1d4ed8;
}

button.active{
  background:#2563eb;
}

#board{
  display:grid;
  border:4px solid white;
  border-radius:12px;
  overflow:hidden;
}

.cell{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  cursor:pointer;
  font-size:28px;
  transition:0.15s;
  border:1px solid rgba(255,255,255,0.08);
}

.cell:hover{
  filter:brightness(1.1);
}

.star{
  color:#facc15;
  text-shadow:0 0 10px rgba(250,204,21,0.8);
}

.xmark{
  color:#cbd5e1;
  font-size:22px;
}

.invalid{
  background:#7f1d1d !important;
}

#message{
  margin-top:10px;
  min-height:24px;
  font-weight:bold;
}

.rule{
  margin-top:20px;
  text-align:center;
  line-height:1.7;
  opacity:0.8;
}

@media(max-width:600px){
  .cell{
    width:40px;
    height:40px;
    font-size:22px;
  }
  .xmark{
    font-size:18px;
  }
}

</style>
</head>

<body>

<h1>⭐ Star Battle</h1>

<div class="controls">
  <button id="starBtn" onclick="setMode('star')">★ モード</button>
  <button id="xBtn" onclick="setMode('x')">✕ モード</button>

  <button onclick="newGame()">新しい問題</button>
  <button onclick="showAnswer()">答え表示</button>
</div>

<div id="board"></div>
<div id="message"></div>

<div class="rule">
各行・列・エリアに星を1つずつ<br>
星同士は縦横斜めに隣接不可
</div>

<script>

const SIZE = 8;
const REGION_COUNT = 8;

let player = [];
let regions = [];
let solution = [];
let mode = "star";

const board =
  document.getElementById("board");

const message =
  document.getElementById("message");

const regionColors = [
  "#172554",
  "#3f1d2e",
  "#14532d",
  "#3f3f46",
  "#312e81",
  "#422006",
  "#0f766e",
  "#4c0519"
];

/* =========================
   モード切替
========================= */

function setMode(m){

  mode = m;

  starBtn.classList.remove("active");
  xBtn.classList.remove("active");

  if(m === "star") starBtn.classList.add("active");
  if(m === "x") xBtn.classList.add("active");
}

/* =========================
   乱数・シャッフル
========================= */

function seededRandom(seed){

  return function(){

    seed =
      (seed * 1664525 + 1013904223)
      % 4294967296;

    return seed / 4294967296;
  }
}

function shuffle(arr, rand){

  for(let i=arr.length-1;i>0;i--){

    const j =
      Math.floor(rand()*(i+1));

    [arr[i],arr[j]] =
      [arr[j],arr[i]];
  }

  return arr;
}

/* =========================
   エリア生成（8エリア固定）
========================= */

function generateRegions(seed){

  const rand =
    seededRandom(seed);

  const grid =
    Array.from({length:SIZE},
      ()=>Array(SIZE).fill(-1));

  const seeds = [];

  while(seeds.length < REGION_COUNT){

    const r = Math.floor(rand()*SIZE);
    const c = Math.floor(rand()*SIZE);

    if(
      !seeds.some(([sr,sc])=>
        sr===r && sc===c
      )
    ){
      seeds.push([r,c]);
    }
  }

  for(let i=0;i<REGION_COUNT;i++){
    const [r,c] = seeds[i];
    grid[r][c] = i;
  }

  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  let changed = true;

  while(changed){

    changed = false;

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){

        const id = grid[r][c];
        if(id === -1) continue;

        for(const [dr,dc] of dirs){

          const nr = r + dr;
          const nc = c + dc;

          if(
            nr>=0&&nc>=0&&
            nr<SIZE&&nc<SIZE&&
            grid[nr][nc] === -1
          ){
            if(Math.random() < 0.6){

              grid[nr][nc] = id;
              changed = true;
            }
          }
        }
      }
    }
  }

  // 空き埋め
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(grid[r][c] === -1){

        const dirs2 = [[1,0],[-1,0],[0,1],[0,-1]];

        for(const [dr,dc] of dirs2){

          const nr = r + dr;
          const nc = c + dc;

          if(
            nr>=0&&nc>=0&&
            nr<SIZE&&nc<SIZE&&
            grid[nr][nc] !== -1
          ){
            grid[r][c] = grid[nr][nc];
            break;
          }
        }
      }
    }
  }

  return grid;
}

/* =========================
   ルール判定
========================= */

function isValid(stars,r,c){

  for(const [sr,sc] of stars){

    if(sr===r||sc===c) return false;

    if(
      Math.abs(sr-r)<=1 &&
      Math.abs(sc-c)<=1
    ){
      return false;
    }

    if(
      regions[sr][sc] ===
      regions[r][c]
    ){
      return false;
    }
  }

  return true;
}

/* =========================
   解答生成
========================= */

function solve(){

  const stars = [];

  function dfs(row){

    if(row === SIZE) return true;

    for(let c=0;c<SIZE;c++){

      if(isValid(stars,row,c)){

        stars.push([row,c]);

        if(dfs(row+1)) return true;

        stars.pop();
      }
    }

    return false;
  }

  dfs(0);
  return stars;
}

/* =========================
   初期化
========================= */

function setup(seed){

  regions = generateRegions(seed);
  solution = solve();

  player = Array.from(
    {length:SIZE},
    ()=>Array.from(
      {length:SIZE},
      ()=>({star:false,x:false})
    )
  );

  draw();
}

/* =========================
   描画
========================= */

function draw(){

  board.innerHTML = "";
  board.style.gridTemplateColumns =
    `repeat(${SIZE},1fr)`;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      const cell =
        document.createElement("div");

      cell.className = "cell";

      const id = regions[r][c];

      cell.style.background =
        regionColors[id];

      if(player[r][c].star)
        cell.innerHTML = "★";

      if(player[r][c].x)
        cell.innerHTML = "✕";

      cell.onclick = ()=>{

        if(mode === "star"){

          player[r][c].star =
            !player[r][c].star;

          if(player[r][c].star)
            player[r][c].x = false;
        }

        if(mode === "x"){

          player[r][c].x =
            !player[r][c].x;

          if(player[r][c].x)
            player[r][c].star = false;
        }

        draw();
        validate();
      };

      board.appendChild(cell);
    }
  }
}

/* =========================
   チェック
========================= */

function validate(){

  let stars = [];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(player[r][c].star)
        stars.push([r,c]);
    }
  }

  let ok = true;

  for(const [r,c] of stars){
    if(!isValid(stars,r,c)) ok = false;
  }

  if(ok && stars.length === SIZE){
    message.textContent = "🎉 クリア！";
  }else{
    message.textContent = "";
  }
}

/* =========================
   答え表示
========================= */

function showAnswer(){

  for(const [r,c] of solution){

    player[r][c].star = true;
    player[r][c].x = false;
  }

  draw();
}

/* =========================
   新規
========================= */

function newGame(){

  const seed = Date.now();
  location.hash = seed;
  setup(seed);
}

/* 起動 */

const seed =
  Number(location.hash.replace("#",""))
  || Date.now();

location.hash = seed;

setup(seed);

</script>

</body>
</html>
