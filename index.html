<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Star Battle</title>

<style>
*{
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  margin:0;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

h1{margin-bottom:10px;}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  background:#334155;
  color:white;
  cursor:pointer;
}

button.active{background:#2563eb;}

#board{
  display:grid;
  border:4px solid white;
  border-radius:12px;
  overflow:hidden;
}

.cell{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  user-select:none;
}

#msg{margin-top:10px;min-height:20px;}

@media(max-width:600px){
  .cell{width:40px;height:40px;font-size:22px;}
}
</style>
</head>

<body>

<h1>⭐ Star Battle</h1>

<div class="controls">
  <button id="starBtn" onclick="setMode('star')">⭐ 星</button>
  <button id="xBtn" onclick="setMode('x')">❌ バツ</button>
  <button onclick="newGame()">新しい問題</button>
  <button onclick="showAnswer()">答え表示</button>
</div>

<div id="board"></div>
<div id="msg"></div>

<script>

const SIZE = 8;
const REGION_COUNT = 8;

let mode = "star";
let regions = [];
let boardData = [];
let solution = [];

const board = document.getElementById("board");
const msg = document.getElementById("msg");

const COLORS = [
 "#172554","#3f1d2e","#14532d","#312e81",
 "#422006","#0f766e","#374151","#4c0519"
];

/* =========================
   モード
========================= */
function setMode(m){

  mode = m;

  starBtn.classList.remove("active");
  xBtn.classList.remove("active");

  if(m==="star") starBtn.classList.add("active");
  if(m==="x") xBtn.classList.add("active");
}

/* =========================
   ★★★ 超重要：8エリア完全保証生成 ★★★
========================= */
function generateRegions(){

  while(true){

    const grid =
      Array.from({length:SIZE},
        ()=>Array(SIZE).fill(-1));

    // ① シード8個（必ず8個）
    const seeds = [];

    while(seeds.length < REGION_COUNT){

      const r = Math.floor(Math.random()*SIZE);
      const c = Math.floor(Math.random()*SIZE);

      if(!seeds.some(s=>s[0]===r && s[1]===c)){
        seeds.push([r,c]);
      }
    }

    for(let i=0;i<REGION_COUNT;i++){
      const [r,c] = seeds[i];
      grid[r][c] = i;
    }

    // ② 拡張（ランダム成長）
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    let changed = true;

    while(changed){

      changed = false;

      for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){

          const id = grid[r][c];
          if(id === -1) continue;

          for(const [dr,dc] of dirs){

            const nr=r+dr,nc=c+dc;

            if(
              nr>=0&&nc>=0&&
              nr<SIZE&&nc<SIZE&&
              grid[nr][nc]===-1 &&
              Math.random()<0.55
            ){
              grid[nr][nc]=id;
              changed=true;
            }
          }
        }
      }
    }

    // ③ 空き埋め
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){

        if(grid[r][c]===-1){

          for(const [dr,dc] of dirs){

            const nr=r+dr,nc=c+dc;

            if(
              nr>=0&&nc>=0&&
              nr<SIZE&&nc<SIZE&&
              grid[nr][nc]!==-1
            ){
              grid[r][c]=grid[nr][nc];
              break;
            }
          }
        }
      }
    }

    // ★★★ ここが完全保証ポイント ★★★

    const counts = Array(REGION_COUNT).fill(0);

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        counts[grid[r][c]]++;
      }
    }

    const valid =
      counts.every(v => v >= 2) &&
      counts.filter(v => v>0).length === REGION_COUNT;

    if(valid){
      return grid; // ★8エリア確定
    }

    // ダメなら再生成
  }
}

/* =========================
   ルール
========================= */
function ok(stars,r,c){

  for(const [y,x] of stars){

    if(y===r||x===c) return false;

    if(Math.abs(y-r)<=1 && Math.abs(x-c)<=1)
      return false;

    if(regions[y][x]===regions[r][c])
      return false;
  }

  return true;
}

/* =========================
   解
========================= */
function solve(){

  const stars=[];

  function dfs(r){

    if(r===SIZE) return true;

    for(let c=0;c<SIZE;c++){

      if(ok(stars,r,c)){

        stars.push([r,c]);

        if(dfs(r+1)) return true;

        stars.pop();
      }
    }

    return false;
  }

  dfs(0);
  return stars;
}

/* =========================
   初期化
========================= */
function setup(){

  regions = generateRegions(); // ★ここが保証済み

  solution = solve();

  boardData =
    Array.from({length:SIZE},
      ()=>Array.from({length:SIZE},
        ()=>({star:false,x:false})
      )
    );

  draw();
}

/* =========================
   描画
========================= */
function draw(){

  board.innerHTML="";
  board.style.gridTemplateColumns =
    `repeat(${SIZE},1fr)`;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      const cell =
        document.createElement("div");

      cell.className="cell";

      cell.style.background =
        COLORS[regions[r][c]];

      if(boardData[r][c].star)
        cell.innerHTML="⭐";

      if(boardData[r][c].x)
        cell.innerHTML="❌";

      cell.onclick=()=>{

        if(mode==="star"){

          boardData[r][c].star =
            !boardData[r][c].star;

          if(boardData[r][c].star)
            boardData[r][c].x=false;
        }

        if(mode==="x"){

          boardData[r][c].x =
            !boardData[r][c].x;

          if(boardData[r][c].x)
            boardData[r][c].star=false;
        }

        draw();
        check();
      };

      board.appendChild(cell);
    }
  }
}

/* =========================
   チェック
========================= */
function check(){

  let stars=[];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(boardData[r][c].star)
        stars.push([r,c]);
    }
  }

  let okFlag=true;

  for(const [r,c] of stars){
    if(!ok(stars,r,c)) okFlag=false;
  }

  if(okFlag && stars.length===SIZE){
    msg.textContent="🎉 クリア！";
  }else{
    msg.textContent="";
  }
}

/* =========================
   答え
========================= */
function showAnswer(){

  boardData =
    boardData.map((row,r)=>
      row.map((_,c)=>({
        star:
          solution.some(
            ([y,x])=>y===r&&x===c
          ),
        x:false
      }))
    );

  draw();
}

setMode("star");
setup();

</script>

</body>
</html>
