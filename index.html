<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Star Battle</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:sans-serif;
    }

    body{
      margin:0;
      background:#0f172a;
      color:white;
      display:flex;
      flex-direction:column;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    h1{
      margin-bottom:10px;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-bottom:20px;
      flex-wrap:wrap;
      justify-content:center;
    }

    button{
      border:none;
      background:#2563eb;
      color:white;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
    }

    button:hover{
      background:#1d4ed8;
    }

    #board{
      display:grid;
      gap:0;
      border:3px solid white;
      border-radius:12px;
      overflow:hidden;
    }

    .cell{
      width:52px;
      height:52px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      cursor:pointer;
      user-select:none;
      transition:0.15s;
      position:relative;
      border:1px solid #334155;
    }

    .cell:hover{
      filter:brightness(1.1);
    }

    .star{
      color:#facc15;
      text-shadow:0 0 10px rgba(250,204,21,0.8);
    }

    .xmark{
      color:#94a3b8;
      font-size:24px;
    }

    .invalid{
      background:#7f1d1d !important;
    }

    #message{
      margin-top:16px;
      font-weight:bold;
      min-height:24px;
    }

    .rule{
      margin-top:20px;
      opacity:0.7;
      text-align:center;
      line-height:1.6;
    }

    @media(max-width:600px){
      .cell{
        width:40px;
        height:40px;
        font-size:22px;
      }

      .xmark{
        font-size:18px;
      }
    }
  </style>
</head>

<body>

<h1>⭐ Star Battle</h1>

<div class="controls">
  <button onclick="newGame()">新しい問題</button>
  <button onclick="showAnswer()">答え表示</button>
  <button onclick="copyURL()">URL共有</button>
</div>

<div id="board"></div>

<div id="message"></div>

<div class="rule">
  左クリック：星を置く<br>
  右クリック：バツ印<br><br>

  各行・列・エリアに星は1つだけ。<br>
  星同士は縦横斜めに隣接できません。
</div>

<script>
const SIZE = 8;

let player = [];
let solution = [];
let regions = [];

const board = document.getElementById("board");
const message = document.getElementById("message");

const regionColors = [
  "#1e293b",
  "#172554",
  "#3f1d2e",
  "#1f2937",
  "#3b0764",
  "#0f766e",
  "#3f3f46",
  "#422006",
  "#0c4a6e",
  "#3f6212",
  "#312e81",
  "#4c0519",
  "#374151",
  "#14532d",
  "#713f12",
  "#581c87"
];

function random(seed){
  return function(){
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }
}

function createRegions(){

  const arr = [];

  for(let r=0;r<SIZE;r++){

    arr[r] = [];

    for(let c=0;c<SIZE;c++){

      arr[r][c] =
        Math.floor(r/2)*4 +
        Math.floor(c/2);
    }
  }

  return arr;
}

function canPlace(stars,r,c){

  for(const [sr,sc] of stars){

    if(sr===r) return false;
    if(sc===c) return false;

    if(Math.abs(sr-r)<=1 &&
       Math.abs(sc-c)<=1){
      return false;
    }

    if(regions[sr][sc]===regions[r][c]){
      return false;
    }
  }

  return true;
}

function generateSolution(seed){

  const rand = random(seed);

  const stars = [];

  let tries = 0;

  while(stars.length < SIZE &&
        tries < 10000){

    const r = Math.floor(rand()*SIZE);
    const c = Math.floor(rand()*SIZE);

    if(canPlace(stars,r,c)){
      stars.push([r,c]);
    }

    tries++;
  }

  if(stars.length < SIZE){
    return generateSolution(seed+1);
  }

  return stars;
}

function setup(seed){

  regions = createRegions();

  solution = generateSolution(seed);

  player = [];

  for(let r=0;r<SIZE;r++){

    player[r] = [];

    for(let c=0;c<SIZE;c++){

      player[r][c] = {
        star:false,
        x:false
      };
    }
  }

  draw();
}

function draw(){

  board.innerHTML = "";

  board.style.gridTemplateColumns =
    `repeat(${SIZE}, 1fr)`;

  for(let r=0;r<SIZE;r++){

    for(let c=0;c<SIZE;c++){

      const cell = document.createElement("div");

      cell.className = "cell";

      const region = regions[r][c];

      cell.style.background =
        regionColors[
          region % regionColors.length
        ];

      if(player[r][c].star){
        cell.innerHTML =
          '<span class="star">★</span>';
      }

      if(player[r][c].x){
        cell.innerHTML =
          '<span class="xmark">✕</span>';
      }

      // エリア境界線
      if(r > 0 &&
         regions[r][c] !== regions[r-1][c]){
        cell.style.borderTop =
          "4px solid white";
      }

      if(c > 0 &&
         regions[r][c] !== regions[r][c-1]){
        cell.style.borderLeft =
          "4px solid white";
      }

      cell.onclick = ()=>{

        player[r][c].star =
          !player[r][c].star;

        if(player[r][c].star){
          player[r][c].x = false;
        }

        draw();
        check();
      };

      // 右クリック
      cell.oncontextmenu = (e)=>{

        e.preventDefault();

        player[r][c].x =
          !player[r][c].x;

        if(player[r][c].x){
          player[r][c].star = false;
        }

        draw();
      };

      board.appendChild(cell);
    }
  }

  highlightErrors();
}

function highlightErrors(){

  const cells =
    document.querySelectorAll(".cell");

  const stars = [];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(player[r][c].star){
        stars.push([r,c]);
      }
    }
  }

  for(let i=0;i<stars.length;i++){

    const [r1,c1] = stars[i];

    for(let j=i+1;j<stars.length;j++){

      const [r2,c2] = stars[j];

      const bad =
        r1===r2 ||
        c1===c2 ||
        regions[r1][c1]===
        regions[r2][c2] ||
        (
          Math.abs(r1-r2)<=1 &&
          Math.abs(c1-c2)<=1
        );

      if(bad){

        cells[r1*SIZE+c1]
          .classList.add("invalid");

        cells[r2*SIZE+c2]
          .classList.add("invalid");
      }
    }
  }
}

function check(){

  let ok = true;

  for(const [r,c] of solution){

    if(!player[r][c].star){
      ok = false;
    }
  }

  let count = 0;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(player[r][c].star){
        count++;
      }
    }
  }

  if(ok && count===SIZE){

    message.innerText =
      "🎉 クリア！";

  }else{

    message.innerText = "";
  }
}

function showAnswer(){

  for(const [r,c] of solution){

    player[r][c].star = true;
    player[r][c].x = false;
  }

  draw();
}

function newGame(){

  const seed = Date.now();

  location.hash = seed;

  setup(seed);
}

function copyURL(){

  navigator.clipboard.writeText(
    location.href
  );

  message.innerText =
    "URLをコピーしました";
}

const seed =
  Number(location.hash.replace("#",""))
  || Date.now();

location.hash = seed;

setup(seed);

</script>

</body>
</html>
