<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Star Battle</title>

<style>

*{
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  margin:0;
  background:#0f172a;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
  min-height:100vh;
}

h1{
  margin-bottom:10px;
}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  border:none;
  background:#2563eb;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

#board{
  display:grid;
  gap:0;
  border:4px solid white;
  overflow:hidden;
  border-radius:12px;
}

.cell{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  font-size:28px;
  border:1px solid rgba(255,255,255,0.1);
  transition:0.15s;
}

.cell:hover{
  filter:brightness(1.1);
}

.star{
  color:#facc15;
  text-shadow:0 0 10px rgba(250,204,21,0.8);
}

.xmark{
  color:#cbd5e1;
  font-size:22px;
}

.invalid{
  background:#7f1d1d !important;
}

#message{
  margin-top:16px;
  min-height:24px;
  font-weight:bold;
}

.rule{
  margin-top:20px;
  opacity:0.8;
  line-height:1.7;
  text-align:center;
}

@media(max-width:600px){

  .cell{
    width:40px;
    height:40px;
    font-size:22px;
  }

  .xmark{
    font-size:18px;
  }

}

</style>
</head>

<body>

<h1>⭐ Star Battle</h1>

<div class="controls">
  <button onclick="newGame()">新しい問題</button>
  <button onclick="showAnswer()">答え表示</button>
  <button onclick="copyURL()">URL共有</button>
</div>

<div id="board"></div>

<div id="message"></div>

<div class="rule">
左クリック：★<br>
右クリック：✕<br><br>

各行・列・エリアに<br>
星を1つずつ置く。<br><br>

星同士は縦横斜めに隣接不可。
</div>

<script>

const SIZE = 8;

let player = [];
let solution = [];
let regions = [];

const board = document.getElementById("board");
const message = document.getElementById("message");

const regionColors = [
  "#172554",
  "#3f1d2e",
  "#1e293b",
  "#3f3f46",
  "#0f766e",
  "#422006",
  "#14532d",
  "#4c0519",
  "#312e81",
  "#374151",
  "#581c87",
  "#713f12"
];

function seededRandom(seed){

  return function(){

    seed =
      (seed * 9301 + 49297)
      % 233280;

    return seed / 233280;
  };
}

function createRegions(seed){

  const rand = seededRandom(seed);

  const grid = [];

  for(let r=0;r<SIZE;r++){

    grid[r] = [];

    for(let c=0;c<SIZE;c++){

      grid[r][c] = -1;
    }
  }

  let regionId = 0;

  const dirs = [
    [1,0],
    [-1,0],
    [0,1],
    [0,-1]
  ];

  for(let start=0;start<SIZE*SIZE;start++){

    const sr = Math.floor(start / SIZE);
    const sc = start % SIZE;

    if(grid[sr][sc] !== -1){
      continue;
    }

    const targetSize =
      4 + Math.floor(rand()*4);

    const queue = [[sr,sc]];

    grid[sr][sc] = regionId;

    let count = 1;

    while(queue.length && count < targetSize){

      const index =
        Math.floor(rand()*queue.length);

      const [r,c] =
        queue[index];

      const shuffled =
        [...dirs].sort(()=>rand()-0.5);

      for(const [dr,dc] of shuffled){

        const nr = r + dr;
        const nc = c + dc;

        if(
          nr < 0 ||
          nc < 0 ||
          nr >= SIZE ||
          nc >= SIZE
        ){
          continue;
        }

        if(grid[nr][nc] !== -1){
          continue;
        }

        grid[nr][nc] = regionId;

        queue.push([nr,nc]);

        count++;

        if(count >= targetSize){
          break;
        }
      }
    }

    regionId++;
  }

  return grid;
}

function canPlace(stars,r,c){

  for(const [sr,sc] of stars){

    if(sr === r) return false;
    if(sc === c) return false;

    if(
      Math.abs(sr-r)<=1 &&
      Math.abs(sc-c)<=1
    ){
      return false;
    }

    if(
      regions[sr][sc] ===
      regions[r][c]
    ){
      return false;
    }
  }

  return true;
}

function generateSolution(seed){

  const rand = seededRandom(seed);

  const stars = [];

  let tries = 0;

  while(
    stars.length < SIZE &&
    tries < 20000
  ){

    const r =
      Math.floor(rand()*SIZE);

    const c =
      Math.floor(rand()*SIZE);

    if(canPlace(stars,r,c)){

      const region =
        regions[r][c];

      const used =
        stars.some(([sr,sc])=>
          regions[sr][sc]===region
        );

      if(!used){

        stars.push([r,c]);
      }
    }

    tries++;
  }

  if(stars.length < SIZE){

    return generateSolution(seed+1);
  }

  return stars;
}

function setup(seed){

  regions = createRegions(seed);

  solution =
    generateSolution(seed);

  player = [];

  for(let r=0;r<SIZE;r++){

    player[r] = [];

    for(let c=0;c<SIZE;c++){

      player[r][c] = {
        star:false,
        x:false
      };
    }
  }

  draw();
}

function draw(){

  board.innerHTML = "";

  board.style.gridTemplateColumns =
    `repeat(${SIZE},1fr)`;

  for(let r=0;r<SIZE;r++){

    for(let c=0;c<SIZE;c++){

      const cell =
        document.createElement("div");

      cell.className = "cell";

      const region =
        regions[r][c];

      cell.style.background =
        regionColors[
          region %
          regionColors.length
        ];

      if(player[r][c].star){

        cell.innerHTML =
          '<span class="star">★</span>';
      }

      if(player[r][c].x){

        cell.innerHTML =
          '<span class="xmark">✕</span>';
      }

      // 境界線

      if(
        r > 0 &&
        regions[r][c] !==
        regions[r-1][c]
      ){
        cell.style.borderTop =
          "4px solid white";
      }

      if(
        c > 0 &&
        regions[r][c] !==
        regions[r][c-1]
      ){
        cell.style.borderLeft =
          "4px solid white";
      }

      cell.onclick = ()=>{

        player[r][c].star =
          !player[r][c].star;

        if(player[r][c].star){

          player[r][c].x = false;
        }

        draw();
        check();
      };

      cell.oncontextmenu = (e)=>{

        e.preventDefault();

        player[r][c].x =
          !player[r][c].x;

        if(player[r][c].x){

          player[r][c].star = false;
        }

        draw();
      };

      board.appendChild(cell);
    }
  }

  highlightErrors();
}

function highlightErrors(){

  const cells =
    document.querySelectorAll(".cell");

  const stars = [];

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(player[r][c].star){

        stars.push([r,c]);
      }
    }
  }

  for(let i=0;i<stars.length;i++){

    const [r1,c1] = stars[i];

    for(let j=i+1;j<stars.length;j++){

      const [r2,c2] = stars[j];

      const bad =
        r1===r2 ||
        c1===c2 ||

        regions[r1][c1]===
        regions[r2][c2] ||

        (
          Math.abs(r1-r2)<=1 &&
          Math.abs(c1-c2)<=1
        );

      if(bad){

        cells[r1*SIZE+c1]
          .classList.add("invalid");

        cells[r2*SIZE+c2]
          .classList.add("invalid");
      }
    }
  }
}

function check(){

  let ok = true;

  // 解答チェック
  for(const [r,c] of solution){

    if(!player[r][c].star){

      ok = false;
    }
  }

  // 星数
  let count = 0;

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(player[r][c].star){

        count++;
      }
    }
  }

  // エリアに最低1個あるか
  const regionSet = new Set();

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){

      if(player[r][c].star){

        regionSet.add(
          regions[r][c]
        );
      }
    }
  }

  if(
    ok &&
    count===SIZE &&
    regionSet.size===SIZE
  ){

    message.innerText =
      "🎉 クリア！";

  }else{

    message.innerText = "";
  }
}

function showAnswer(){

  for(const [r,c] of solution){

    player[r][c].star = true;
    player[r][c].x = false;
  }

  draw();
}

function newGame(){

  const seed = Date.now();

  location.hash = seed;

  setup(seed);
}

function copyURL(){

  navigator.clipboard.writeText(
    location.href
  );

  message.innerText =
    "URLをコピーしました";
}

const seed =
  Number(
    location.hash.replace("#","")
  )
  || Date.now();

location.hash = seed;

setup(seed);

</script>

</body>
</html>
